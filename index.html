<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>إمبراطورية الأعمال المصرية</title>
<style>
body{margin:0;background:#0a1628;color:#fff;font-family:system-ui;}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:#0f1a2e;padding-bottom:72px;}
.top{padding:12px;text-align:center;background:#0a1428;border-bottom:1px solid #d4af37;}
.bal{font-size:1.6rem;font-weight:bold;} .bal small{color:#d4af37;}
.inc{color:#22c55e;font-size:0.8rem;}
.news{margin:8px 12px;background:#151e30;padding:8px;border-radius:8px;font-size:0.75rem;border-left:3px solid #d4af37;}
.click{width:140px;height:140px;margin:12px auto;border-radius:50%;background:#1a2744;border:4px solid #d4af37;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;}
.section{color:#d4af37;margin:10px 12px 5px;font-weight:bold;font-size:0.85rem;}
.item{margin:0 12px 6px;background:#151e30;border:1px solid #d4af3733;border-radius:10px;padding:10px;display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;}
.inc{color:#22c55e;} .down{color:#ef4444;}
button{background:#d4af37;color:#0a1428;border:none;padding:6px 10px;border-radius:6px;font-weight:bold;font-size:0.7rem;cursor:pointer;}
button:disabled{background:#444;color:#888;}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;height:68px;background:#0a101c;border-top:1px solid #d4af37;display:flex;overflow-x:auto;}
.nav div{flex:1;min-width:55px;text-align:center;font-size:0.58rem;color:#888;cursor:pointer;padding-top:6px;}
.nav div.active{color:#d4af37;}
.nav .ic{font-size:1.15rem;display:block;}
.tab{display:none;} .tab.active{display:block;}
select{width:100%;padding:6px;margin:4px 0;background:#0a101c;color:#fff;border:1px solid #d4af37;border-radius:6px;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="bal" id="bal">0 <small>ج.م</small></div>
    <div class="inc" id="inc">+0 /ث</div>
  </div>
  <div class="news" id="news">أخبار اليوم: السوق مستقر</div>

  <div class="tab active" id="t-earn">
    <div class="click" id="click">👆 اضغط</div>
    <div class="section">وظائف</div><div id="jobs"></div>
    <div class="section">كورسات</div><div id="courses"></div>
  </div>

  <div class="tab" id="t-biz">
    <div class="section">إنشاء مشروع</div>
    <div class="item" style="flex-direction:column;align-items:stretch;">
      <select id="ptype" onchange="showCost()">
        <option value="">نوع المشروع</option>
        <option value="restaurant">مطعم - 500 ج.م</option>
        <option value="cafe">كافيه - 1,000 ج.م</option>
        <option value="market">سوبر ماركت - 6,000 ج.م</option>
        <option value="taxi">شركة تاكسي - 30,000 ج.م</option>
        <option value="factory">مصنع - 150,000 ج.م</option>
        <option value="bank">بنك - 900,000 ج.م</option>
        <option value="real">عقارات - 5,000,000 ج.م</option>
        <option value="hotel">فندق - 25,000,000 ج.م</option>
      </select>
      <select id="ploc"><option>القاهرة</option><option>الإسكندرية</option><option>شرم الشيخ</option><option>الساحل</option><option>العاصمة الإدارية</option></select>
      <button onclick="createP()">إنشاء المشروع</button>
    </div>
    <div class="section">مشاريعي</div><div id="projects"></div>
  </div>

  <div class="tab" id="t-trade">
    <div class="section">بورصة مصر</div><div id="egx"></div>
    <div class="section">بورصة أمريكا</div><div id="us"></div>
  </div>
  <div class="tab" id="t-cars">
    <div class="section">عربيات ودرجات نارية</div><div id="vehicles"></div>
    <div class="section">الجراج</div><div id="garage"></div>
  </div>
  <div class="tab" id="t-house"><div class="section">مساكن مصر والعالم</div><div id="houses"></div></div>
  <div class="tab" id="t-fashion"><div class="section">ملابس ومجوهرات وبراندات</div><div id="fashion"></div></div>
  <div class="tab" id="t-more">
    <div class="section">أعمال خيرية</div>
    <div id="charity"></div>
    <div class="section">قروض بنكية</div>
    <div id="loans"></div>
    <div class="section">ترتيب الأغنياء</div>
    <div id="ranking"></div>
  </div>
</div>

<div class="nav">
  <div class="active" onclick="show('earn')"><span class="ic">💰</span>أرباح</div>
  <div onclick="show('biz')"><span class="ic">🏢</span>أعمال</div>
  <div onclick="show('trade')"><span class="ic">📈</span>تداول</div>
  <div onclick="show('cars')"><span class="ic">🚗</span>مركبات</div>
  <div onclick="show('house')"><span class="ic">🏠</span>سكن</div>
  <div onclick="show('fashion')"><span class="ic">💎</span>موضة</div>
  <div onclick="show('more')"><span class="ic">➕</span>أكتر</div>
</div>

<script>
let money=0, prestige=1, job=null, power=1, projects=[], garage=[];
const news=["السوق مستقر","ارتفاع بورصة مصر","موسم سياحي قوي في شرم","تقلبات النفط"];
const ptypes={
  restaurant:{c:500,i:12,l:'مطعم'},cafe:{c:1000,i:22,l:'كافيه'},market:{c:6000,i:70,l:'سوبر ماركت'},
  taxi:{c:30000,i:280,l:'تاكسي'},factory:{c:150000,i:1100,l:'مصنع'},bank:{c:900000,i:6500,l:'بنك'},
  real:{c:5000000,i:32000,l:'عقارات'},hotel:{c:25000000,i:160000,l:'فندق'}
};
const jobs=[{n:'بدون',p:1,c:0},{n:'توصيل',p:10,c:700},{n:'كاشير',p:30,c:3500},{n:'تاكسي',p:85,c:20000},{n:'مندوب',p:220,c:120000},{n:'مدير',p:550,c:600000}];
const courses=[{n:'إدارة',b:1.3,c:15000},{n:'تسويق',b:1.5,c:50000},{n:'استثمار',b:1.8,c:150000}];
const egx=[
  {n:'CIB',p:90,o:0},{n:'أورانج مصر',p:14,o:0},{n:'حديد عز',p:55,o:0},
  {n:'طلعت مصطفى',p:22,o:0},{n:'بنك الأهلي',p:36,o:0},{n:'المصرية للاتصالات',p:29,o:0},
  {n:'جهينة',p:10,o:0},{n:'السويدي',p:19,o:0},{n:'إعمار مصر',p:7.5,o:0},
  {n:'بالم هيلز',p:4.2,o:0}
];
const us=[
  {n:'Apple',p:198,o:0},{n:'Tesla',p:260,o:0},{n:'Microsoft',p:425,o:0},
  {n:'Amazon',p:190,o:0},{n:'Google',p:175,o:0},{n:'NVIDIA',p:135,o:0},
  {n:'Meta',p:520,o:0},{n:'Netflix',p:680,o:0}
];

const vehicles=[
  {n:'ياماها دراجات',p:48000},{n:'هوندا دراجات',p:58000},{n:'كاواساكي دراجات',p:130000},
  {n:'فيات 128',p:70000},{n:'لادا',p:115000},{n:'أكسنت',p:270000},{n:'أوبترا',p:390000},
  {n:'كورولا',p:740000},{n:'إلنترا',p:930000},{n:'سيراتو',p:990000},{n:'كامري',p:1680000},
  {n:'مرسيدس C',p:2950000},{n:'BMW 3',p:3350000},{n:'أودي A4',p:3600000},{n:'مرسيدس E',p:4700000},
  {n:'BMW 5',p:5400000},{n:'مرسيدس S',p:9600000},{n:'رولز رويس',p:27000000},{n:'بنتلي',p:19500000},
  {n:'لامبورجيني',p:16000000},{n:'فيراري',p:22000000},{n:'بوجاتي',p:85000000}
];

const houses=[
  {n:'شقة فيصل 90م',p:950000},{n:'شقة معادي 120م',p:3200000},{n:'شقة تجمع 150م',p:5300000},
  {n:'دوبلكس شيخ زايد',p:9200000},{n:'فيلا صغيرة ساحل',p:14500000},{n:'عمارة مدينة نصر',p:23000000},
  {n:'فيلا فاخرة ساحل',p:39000000},{n:'قصر عاصمة إدارية',p:98000000},
  {n:'شقة دبي',p:8500000},{n:'فيلا ماربيا',p:26000000},{n:'شقة لندن',p:19000000},
  {n:'بيت ميامي',p:13000000},{n:'فيلا لوس أنجلوس',p:37000000},{n:'بنتهاوس نيويورك',p:85000000},
  {n:'قصر باريس',p:65000000},{n:'جزيرة مالديف',p:220000000}
];

const fashion=[
  {n:'تيشيرت قطن',p:220},{n:'جينز',p:850},{n:'نايك',p:4200},{n:'أديداس',p:5200},{n:'بوما',p:3800},
  {n:'زارا',p:6500},{n:'H&M',p:2800},{n:'تومي',p:13000},{n:'لاكوست',p:8500},{n:'هوغو بوس',p:19000},
  {n:'أرماني',p:48000},{n:'غوتشي',p:65000},{n:'برادا',p:58000},{n:'لويس فيتون',p:98000},
  {n:'شانيل',p:130000},{n:'رولكس',p:430000},{n:'أوميغا',p:190000},{n:'باتيك فيليب',p:1600000},
  {n:'خاتم ذهب',p:28000},{n:'سلسلة ذهب',p:42000},{n:'خاتم ألماس',p:160000},{n:'طقم ألماس',p:550000}
];

const charities=[
  {n:'تبرع لمستشفى',cost:20000,prestige:1.05},
  {n:'كفالة أيتام',cost:50000,prestige:1.08},
  {n:'بناء مدرسة',cost:200000,prestige:1.15},
  {n:'حفر آبار',cost:100000,prestige:1.1},
  {n:'وقف خيري كبير',cost:2000000,prestige:1.3},
  {n:'دعم مرضى السرطان',cost:500000,prestige:1.2}
];

const loanOptions=[
  {amount:100000,interest:0.15,name:'قرض صغير'},
  {amount:500000,interest:0.18,name:'قرض متوسط'},
  {amount:2000000,interest:0.22,name:'قرض كبير'},
  {amount:10000000,interest:0.25,name:'قرض استثماري'}
];

let activeLoan=null; // {amount, remaining, interest}

const richList=[
  {name:'إيلون ماسك',worth:250000000000,country:'العالم'},
  {name:'جيف بيزوس',worth:180000000000,country:'العالم'},
  {name:'برنارد أرنو',worth:160000000000,country:'العالم'},
  {name:'ناصف ساويرس',worth:8000000000,country:'مصر'},
  {name:'محمد الفايد',worth:2000000000,country:'مصر'},
  {name:'نجيب ساويرس',worth:4000000000,country:'مصر'},
  {name:'أنت',worth:0,country:'مصر'}
];

function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':Math.floor(n);}
function show(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav div').forEach(x=>x.classList.remove('active'));
  document.getElementById('t-'+t).classList.add('active');
  event.currentTarget.classList.add('active');
}
function createP(){
  const type=document.getElementById('ptype').value;
  if(!type) return alert('اختر النوع');
  const t=ptypes[type];
  if(money<t.c) return alert('فلوس مش كفاية\nالتكلفة: '+fmt(t.c)+'\nالدخل المتوقع: +'+fmt(t.i)+' /ث');
  money-=t.c;
  projects.push({type,loc:document.getElementById('ploc').value,income:t.i,level:1});
  alert('تم إنشاء المشروع!\nالدخل: +'+fmt(t.i)+' /ث');
  render();
}
function manage(i){
  const p=projects[i];
  alert('إدارة: تطوير / عمال / تسويق (قريباً تفاصيل أكتر)');
}
function render(){
  document.getElementById('bal').innerHTML=fmt(money)+' <small>ج.م</small>';
  let passive=projects.reduce((s,p)=>s+p.income,0)*prestige;
  document.getElementById('inc').textContent='+'+fmt(passive)+' /ث';
  document.getElementById('news').innerHTML='<b>أخبار:</b> '+news[Math.floor(Math.random()*news.length)];

  document.getElementById('jobs').innerHTML=jobs.map((j,i)=>`<div class="item"><div>${j.n}<div class="inc">+${j.p}</div></div><button onclick="setJob(${i})" ${money<j.c?'disabled':''}>${j.c?fmt(j.c):'ابدأ'}</button></div>`).join('');
  document.getElementById('courses').innerHTML=courses.map((c,i)=>`<div class="item"><div>${c.n}</div><button onclick="buyC(${i})" ${money<c.c?'disabled':''}>${fmt(c.c)}</button></div>`).join('');

  let h=''; projects.forEach((p,i)=>{h+=`<div class="item"><div>${ptypes[p.type].l} - ${p.loc}<div class="inc">+${fmt(p.income)}</div></div><button onclick="manage(${i})">إدارة</button></div>`;});
  document.getElementById('projects').innerHTML=h||'<div class="item">مفيش مشاريع</div>';

  document.getElementById('egx').innerHTML=egx.map((s,i)=>{
    const ch=(Math.random()*6-3).toFixed(1);
    return `<div class="item"><div>${s.n}<div class="${ch>0?'inc':'down'}">${s.p.toFixed(1)} ج.م (${ch}%)</div><small>مملوك: ${s.o}</small></div>
    <div><button onclick="buyS('egx',${i})">اشتري</button> <button onclick="sellS('egx',${i})">بيع</button></div></div>`;
  }).join('');
  document.getElementById('us').innerHTML=us.map((s,i)=>{
    const ch=(Math.random()*5-2.5).toFixed(1);
    return `<div class="item"><div>${s.n}<div class="${ch>0?'inc':'down'}">$${s.p.toFixed(0)} (${ch}%)</div><small>مملوك: ${s.o}</small></div>
    <div><button onclick="buyS('us',${i})">اشتري</button> <button onclick="sellS('us',${i})">بيع</button></div></div>`;
  }).join('');

  document.getElementById('vehicles').innerHTML=vehicles.map((v,i)=>`<div class="item"><div>${v.n}</div><button onclick="buyV(${i})" ${money<v.p?'disabled':''}>${fmt(v.p)}</button></div>`).join('');
  document.getElementById('garage').innerHTML=garage.map(g=>`<div class="item">${g.n}</div>`).join('')||'<div class="item">الجراج فاضي</div>';
  document.getElementById('houses').innerHTML=houses.map((h,i)=>`<div class="item"><div>${h.n}</div><button onclick="buyH(${i})" ${money<h.p?'disabled':''}>${fmt(h.p)}</button></div>`).join('');
  document.getElementById('fashion').innerHTML=fashion.map((f,i)=>`<div class="item"><div>${f.n}</div><button onclick="buyF(${i})" ${money<f.p?'disabled':''}>${fmt(f.p)}</button></div>`).join('');
  
  // Charity
  document.getElementById('charity').innerHTML=charities.map((c,i)=>`<div class="item"><div>${c.n}<div class="inc">برستيج ×${c.prestige}</div></div><button onclick="donate(${i})" ${money<c.cost?'disabled':''}>${fmt(c.cost)}</button></div>`).join('');
  
  // Loans
  let loanHtml = activeLoan ? `<div class="item"><div>قرض نشط: ${fmt(activeLoan.remaining)} متبقي<br>فايدة ${(activeLoan.interest*100).toFixed(0)}%</div><button onclick="payLoan()">سداد</button></div>` : '';
  loanHtml += loanOptions.map((l,i)=>`<div class="item"><div>${l.name}<br>${fmt(l.amount)} - فايدة ${(l.interest*100)}%</div><button onclick="takeLoan(${i})" ${activeLoan?'disabled':''}>خذ قرض</button></div>`).join('');
  document.getElementById('loans').innerHTML=loanHtml;
  
  // Ranking
  richList[richList.length-1].worth = money;
  const sorted = [...richList].sort((a,b)=>b.worth-a.worth);
  const myRank = sorted.findIndex(r=>r.name==='أنت')+1;
  document.getElementById('ranking').innerHTML = sorted.slice(0,8).map((r,i)=>`<div class="item"><div>${i+1}. ${r.name} (${r.country})</div><div>${fmt(r.worth)}</div></div>`).join('') + `<div class="item" style="background:#1a2744;"><div>ترتيبك: ${myRank}</div><div>${fmt(money)}</div></div>`;
}
function setJob(i){const j=jobs[i]; if(money>=j.c){money-=j.c; job=j; power=j.p; render();}}
function buyC(i){const c=courses[i]; if(money>=c.c){money-=c.c; power*=c.b; render();}}
function buyS(t,i){const a=t==='egx'?egx:us; const s=a[i]; const cost=s.p*(t==='egx'?1:50); if(money>=cost){money-=cost; s.o++; render();}}
function sellS(t,i){const a=t==='egx'?egx:us; const s=a[i]; if(s.o>0){money+=s.p*(t==='egx'?1:50); s.o--; render();}}
function buyV(i){const v=vehicles[i]; if(money>=v.p){money-=v.p; garage.push(v); render();}}
function buyH(i){const h=houses[i]; if(money>=h.p){money-=h.p; prestige*=1.04; render();}}
function buyF(i){const f=fashion[i]; if(money>=f.p){money-=f.p; render();}}

function donate(i){
  const c=charities[i];
  if(money>=c.cost){
    money-=c.cost;
    prestige*=c.prestige;
    alert('تم التبرع! البرستيج زاد');
    render();
  }
}

function takeLoan(i){
  if(activeLoan) return alert('عندك قرض شغال');
  const l=loanOptions[i];
  money+=l.amount;
  activeLoan={amount:l.amount, remaining:l.amount*(1+l.interest), interest:l.interest};
  alert('تم أخذ القرض');
  render();
}

function payLoan(){
  if(!activeLoan) return;
  if(money>=activeLoan.remaining){
    money-=activeLoan.remaining;
    activeLoan=null;
    alert('تم سداد القرض');
  } else {
    alert('فلوس مش كفاية للسداد');
  }
  render();
}

document.getElementById('click').onclick=()=>{money+=power*prestige; render();};
setInterval(()=>{
  egx.forEach(s=>s.p*=(0.96+Math.random()*0.08));
  us.forEach(s=>s.p*=(0.97+Math.random()*0.06));
  let p=projects.reduce((s,x)=>s+x.income,0);
  money+=p*prestige;
  if(activeLoan) activeLoan.remaining *= (1 + activeLoan.interest/200);
  render();
},2000);
render();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
